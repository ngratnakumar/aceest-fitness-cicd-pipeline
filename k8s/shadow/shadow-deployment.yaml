apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
      - name: aceest-fitness-shadow
        image: ngratnakumar/aceest-fitness:v3
        ports:
        - containerPort: 5000
